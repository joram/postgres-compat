tests:

  # Early-failure smoke probes. pg_regress relies on these catalogs implicitly
  # but doesn't probe them up-front, so a managed service that restricts catalog
  # visibility produces a confusing cascade rather than a clear signal.

  - id: catalog-pg-class-populated
    description: "pg_class is queryable and non-empty"
    core: true
    probe:
      - "SELECT 1 FROM pg_class LIMIT 1"
    validate:
      returns_value:
        sql: "SELECT (count(*) > 0)::text FROM pg_class"
        equals: "true"

  - id: catalog-pg-proc-builtin
    description: "pg_proc exposes built-in functions (now())"
    core: true
    probe:
      - "SELECT 1 FROM pg_proc WHERE proname = 'now'"
    validate:
      returns_value:
        sql: "SELECT count(*)::text FROM pg_proc WHERE proname = 'now'"
        equals: "1"

  - id: catalog-information-schema-tables
    description: "information_schema.tables is queryable"
    core: true
    probe:
      - "SELECT 1 FROM information_schema.tables LIMIT 1"
    validate:
      returns_value:
        sql: "SELECT (count(*) > 0)::text FROM information_schema.tables"
        equals: "true"

  - id: catalog-current-database
    description: "current_database() returns a non-empty name"
    core: true
    probe:
      - "SELECT current_database()"
    validate:
      returns_value:
        sql: "SELECT (length(current_database()) > 0)::text"
        equals: "true"

  # contrib introspection extensions — DBAs and operators rely on these.

  - id: catalog-pageinspect-page-header-lsn
    description: "pageinspect page_header() returns a header whose LSN is <= the current WAL LSN — verifies a structural relationship rather than just non-NULL"
    core: false
    extension: pageinspect
    probe:
      - "SELECT lsn FROM page_header(get_raw_page('pg_class', 0))"
    validate:
      returns_value:
        sql: "SELECT ((SELECT lsn FROM page_header(get_raw_page('pg_class', 0))) <= pg_current_wal_lsn())::text"
        equals: "true"

  - id: catalog-pg-buffercache-row-count
    description: "pg_buffercache view exposes exactly one row per shared_buffers 8KB page — verifies the view actually mirrors buffer cache state, not just that it's queryable"
    core: false
    extension: pg_buffercache
    probe:
      - "SELECT count(*) FROM pg_buffercache"
    validate:
      returns_value:
        sql: "SELECT (count(*) = pg_size_bytes(current_setting('shared_buffers')) / 8192)::text FROM pg_buffercache"
        equals: "true"
