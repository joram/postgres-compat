tests:

  - id: connectivity-application-name-roundtrip
    description: "SET application_name takes effect for the session"
    core: true
    alter: false
    setup:
      - "SET application_name = 'pgcompat-probe'"
    probe:
      - "SELECT current_setting('application_name')"
    validate:
      returns_value:
        sql: "SELECT current_setting('application_name')"
        equals: "pgcompat-probe"
    teardown:
      - "RESET application_name"

  - id: connectivity-is-in-recovery
    description: "pg_is_in_recovery() returns a boolean"
    core: true
    alter: false
    probe:
      - "SELECT pg_is_in_recovery()"
    validate:
      returns_value:
        sql: "SELECT (pg_is_in_recovery()::text IN ('true','false'))::text"
        equals: "true"

  - id: connectivity-standard-conforming-strings
    description: "standard_conforming_strings is on (SQL-standard default since PG 9.1; off would silently mis-escape backslashes — correctness and security impact)"
    core: true
    alter: false
    probe:
      - "SHOW standard_conforming_strings"
    validate:
      returns_value:
        sql: "SELECT current_setting('standard_conforming_strings')"
        equals: "on"

  - id: connectivity-pg-stat-statements-view
    description: "pg_stat_statements view is queryable"
    core: false
    alter: false
    extension: pg_stat_statements
    probe:
      - "SELECT count(*) FROM pg_stat_statements LIMIT 1"

  # GUC defaults that drivers, dump tools, and applications rely on.
  # pg_regress assumes these but doesn't probe them as defaults — a vendor
  # that ships with a different default would silently break clients.

  - id: connectivity-bytea-output-hex
    description: "bytea_output defaults to 'hex' (drivers and pg_dump assume this)"
    core: true
    alter: false
    probe:
      - "SHOW bytea_output"
    validate:
      returns_value:
        sql: "SELECT current_setting('bytea_output')"
        equals: "hex"

  - id: connectivity-datestyle-iso
    description: "DateStyle defaults to ISO format (drivers assume ISO)"
    core: true
    alter: false
    probe:
      - "SHOW DateStyle"
    validate:
      returns_value:
        sql: "SELECT split_part(current_setting('DateStyle'), ',', 1)"
        equals: "ISO"

  - id: connectivity-default-transaction-isolation
    description: "default_transaction_isolation is 'read committed' (PG default; ORMs and drivers — Hibernate, SQLAlchemy, libpq — assume Read Committed unless explicitly overridden)"
    core: true
    alter: false
    probe:
      - "SHOW default_transaction_isolation"
    validate:
      returns_value:
        sql: "SELECT current_setting('default_transaction_isolation')"
        equals: "read committed"
